name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: POSIX sh syntax
        run: |
          sh -n skills/gecko/scripts/gecko
          sh -n install.sh
          sh -n tests/smoke.sh

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning

      - name: Smoke tests
        run: sh tests/smoke.sh
